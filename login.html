<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FinanceHubAK Login</title>

<style>
body{
background:black;
color:white;
font-family:Arial,sans-serif;
display:flex;
justify-content:center;
align-items:center;
min-height:100vh;
}

.container{
background:#111;
padding:30px;
border:1px solid gold;
border-radius:12px;
width:90%;
max-width:400px;
text-align:center;
}

h1{
color:gold;
}

input{
width:100%;
padding:12px;
margin:10px 0;
border:none;
border-radius:6px;
}

button{
width:100%;
padding:12px;
margin-top:10px;
background:gold;
color:black;
border:none;
border-radius:6px;
font-weight:bold;
cursor:pointer;
}

#message{
margin-top:15px;
color:lightgreen;
}
</style>
</head>

<body>

<div class="container">

<h1>FinanceHubAK</h1>

<input type="email" id="email" placeholder="Email">
<input type="password" id="password" placeholder="Password">

<button onclick="signup()">Sign Up</button>

<button onclick="login()">Login</button>

<div id="message"></div>

</div>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

import {
getAuth,
createUserWithEmailAndPassword,
signInWithEmailAndPassword
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

const firebaseConfig = {
  apiKey: "AIzaSyDq8fq5Uwi_jzfgvqDRukpkXKh25tgE2Eo",
  authDomain: "financehubak-ede04.firebaseapp.com",
  projectId: "financehubak-ede04",
  storageBucket: "financehubak-ede04.firebasestorage.app",
  messagingSenderId: "482089772321",
  appId: "1:482089772321:web:8fa91f4b5330d52c89ca60",
  measurementId: "G-NXC1HM6VD9"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);

window.signup = function(){

const email =
document.getElementById("email").value;

const password =
document.getElementById("password").value;

createUserWithEmailAndPassword(auth,email,password)

.then(() => {

document.getElementById("message").innerHTML =
"Account Created Successfully ✅";

})

.catch((error) => {

document.getElementById("message").innerHTML =
error.message;

});

}

window.login = function(){

const email =
document.getElementById("email").value;

const password =
document.getElementById("password").value;

signInWithEmailAndPassword(auth,email,password)

.then(() => {

document.getElementById("message").innerHTML =
"Login Successful ✅";

})

.catch((error) => {

document.getElementById("message").innerHTML =
error.message;

});

}

</script>

</body>
</html>
